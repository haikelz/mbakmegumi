apiVersion: apps/v1
kind: Deployment
metadata:
  name: mbakmegumi
  labels:
    app: mbakmegumi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mbakmegumi
  template:
    metadata:
      labels:
        app: mbakmegumi
    spec:
      containers:
        - name: mbakmegumi
          image: haikelilham/mbakmegumi:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
